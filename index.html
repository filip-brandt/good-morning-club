<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good Morning Club</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Good Morning Club</h1>
      <button>menu icon</button>
      <nav>
        <ul>
          <li>Home</li>
          <li>Menu</li>
          <li>Contact</li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Sips</h2>
      </section>

      <section>
        <h2>Grub</h2>
      </section>

      <section>
        <h2>News</h2>
      </section>

      <section>
        <h2>Contact</h2>
        <form action="#">
          <label for="name">First name</label>
          <input type="text" id="name" name="name" required />

          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required />

          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>

          <input type="checkbox" id="sips" name="sips" />
          <label for="sips">Sips</label>
          <input type="checkbox" id="grub" name="grub" />
          <label for="grub">Grub</label>
          <input type="checkbox" id="other" name="other" />
          <label for="other">Other</label>

          <button type="submit">Send</button>
        </form>
      </section>
    </main>
    <footer>
      <address>
        Arabicagatan 13
        <br />
        133 71 Robustad
      </address>

      <div>Open Daily 8.00 -> 15.00</div>
      <div class="footer-socials">Facebook | Instagram | Spotify</div>

      <div class="footer-contacts">
        <div>070-123 45 67</div>
        <div>info@goodmorningclub.se</div>
      </div>
    </footer>
  </body>
</html>
